name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile plugins/boss-brain/scripts/boss.py plugins/boss-brain/scripts/continuity.py scripts/install.py tests/continuity_codex_e2e.py
      - run: bash -n install.sh uninstall.sh tests/remote_codex_e2e.sh
